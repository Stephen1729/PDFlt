appId: com.pdflt.app
productName: PDFlt
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: PDFlt
  target:
    - nsis
nsis:
  artifactName: PDFlt-Setup-${version}.${ext}
  shortcutName: PDFlt
  uninstallDisplayName: PDFlt
  createDesktopShortcut: always
mac:
  target:
    - dmg
  artifactName: PDFlt-${version}.${ext}
linux:
  target:
    - AppImage
  artifactName: PDFlt-${version}.${ext}

